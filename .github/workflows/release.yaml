name: Release new versions

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions: {}

jobs:
  tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current_version="$(jq -r '.version' package.json)"
          previous_version="$(git show "${{ github.event.before }}:package.json" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"

          if [[ -z "$current_version" || "$current_version" == "null" || "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${current_version}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          tag="${STEPS_VERSION_OUTPUTS_TAG}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
        env:
          STEPS_VERSION_OUTPUTS_TAG: ${{ steps.version.outputs.tag }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.changed == 'true'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog content for release
        id: changelog_content
        run: |
          {
            echo 'stdout<<EOF'
            awk '/^## /{if (p) exit; p=1; next} p' CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          BODY: ${{ steps.changelog_content.outputs.stdout }}
        run: |
          prerelease=()
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --title "$TAG" --notes "$BODY" "${prerelease[@]}"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - tag
    if: needs.tag.outputs.changed == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p 'require(\"./package.json\").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on npm
        id: npm_version
        run: |
          if npm view "${STEPS_PACKAGE_OUTPUTS_NAME}@${STEPS_PACKAGE_OUTPUTS_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${STEPS_PACKAGE_OUTPUTS_VERSION} already exists for ${STEPS_PACKAGE_OUTPUTS_NAME}. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_PACKAGE_OUTPUTS_NAME: ${{ steps.package.outputs.name }}
          STEPS_PACKAGE_OUTPUTS_VERSION: ${{ steps.package.outputs.version }}

      - run: npm ci
        if: steps.npm_version.outputs.exists == 'false'

      - run: npm run build
        if: steps.npm_version.outputs.exists == 'false'

      - name: Publish to npm
        if: steps.npm_version.outputs.exists == 'false'
        run: |
          VERSION="${STEPS_PACKAGE_OUTPUTS_VERSION}"
          TAG="latest"
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL="${VERSION#*-}"
            CHANNEL="${CHANNEL%%.*}"
            CHANNEL="${CHANNEL,,}"
            case "$CHANNEL" in
              alpha|beta|rc)
                TAG="$CHANNEL"
                ;;
            esac
          fi
          echo "Publishing ${VERSION} with npm dist-tag: ${TAG}"
          npm publish --provenance --access public --tag "$TAG"
        env:
          STEPS_PACKAGE_OUTPUTS_VERSION: ${{ steps.package.outputs.version }}
